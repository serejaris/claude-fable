<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Клон Majesty — королевство с непрямым управлением</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>👑</text></svg>">
</head>
<body>
  <div id="stage">
    <canvas id="terrain"></canvas>
    <canvas id="entities"></canvas>
    <canvas id="effects"></canvas>
  </div>

  <div id="overlay">
    <header id="topbar">
      <div class="tb-group brand"><span class="crown">👑</span> <span class="title">Majesty<span class="thin">·clone</span></span></div>
      <div class="tb-group"><span class="coin">●</span> <b id="gold">0</b><span class="unit">зол.</span> <span id="rate" class="rate" title="Поступления в казну за последнюю минуту">+0/мин</span></div>
      <div class="tb-group" id="day">День 1 · 00:00</div>
      <div class="tb-group" id="pop">героев: 0</div>
      <div class="tb-group speeds">
        <button class="speed-btn" data-speed="0" title="Пауза (Space)">⏸</button>
        <button class="speed-btn active" data-speed="1" title="Обычная скорость (1)">▶</button>
        <button class="speed-btn" data-speed="2" title="Быстро (2)">▶▶</button>
        <button class="speed-btn" data-speed="4" title="Очень быстро (3)">▶▶▶</button>
        <button class="speed-btn" data-speed="8" title="Стремительно (4)">▶▶▶▶</button>
      </div>
      <div class="tb-group right">
        <button id="btn-save" class="tb-btn" title="Сохранить">💾</button>
        <button id="btn-new" class="tb-btn" title="Новое королевство">⟳</button>
        <button id="btn-help" class="tb-btn" title="Как играть">?</button>
      </div>
    </header>

    <aside id="sidebar">
      <div class="side-title">Постройки</div>
      <div id="build-menu"></div>
      <div class="side-title">Указы</div>
      <div id="flag-menu">
        <button id="flag-attack" class="build-btn flag-a"><span class="b-name">⚑ Награда: атака</span><span class="b-cost">20+</span></button>
        <button id="flag-explore" class="build-btn flag-e"><span class="b-name">⚑ Награда: разведка</span><span class="b-cost">20+</span></button>
      </div>
    </aside>

    <aside id="panel" class="hidden"></aside>
    <div id="ticker"></div>
    <div id="modal" class="hidden"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
