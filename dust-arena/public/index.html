<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DUST ARENA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  #c { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; color: #e8e0c8; text-shadow: 0 1px 2px #000; user-select: none; pointer-events: none; }
  #crosshair { top: 50%; left: 50%; transform: translate(-50%,-50%); color: #7CFC00; font-size: 22px; font-weight: bold; }
  #hp { left: 24px; bottom: 20px; font-size: 28px; font-weight: bold; color: #7CFC00; }
  #ammo { right: 24px; bottom: 20px; font-size: 28px; font-weight: bold; }
  #timer { top: 14px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; }
  #killfeed { top: 14px; right: 18px; font-size: 14px; text-align: right; }
  #killfeed div { margin-bottom: 4px; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 3px; }
  #msg { top: 38%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: bold; color: #ffce54; text-align: center; }
  #dmgflash { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,.45)); opacity: 0; transition: opacity .3s; }
  #healflash { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(40,255,120,.35)); opacity: 0; transition: opacity .4s; }
  #deathveil { inset: 0; background: radial-gradient(ellipse at center, rgba(80,0,0,.25), rgba(60,0,0,.55)); opacity: 0; transition: opacity .5s; }
  #hitmark { top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(45deg); color: #ff5544; font-size: 30px; font-weight: bold; opacity: 0; }
  #scoreboard { top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(10,10,5,.85); padding: 18px 28px; border: 1px solid #5a5238; min-width: 360px; display: none; font-size: 15px; }
  #scoreboard table { width: 100%; border-collapse: collapse; }
  #scoreboard td, #scoreboard th { padding: 4px 10px; text-align: left; }
  #scoreboard th { color: #ffce54; border-bottom: 1px solid #5a5238; }
  #join { position: fixed; inset: 0; background: linear-gradient(#2a2415, #0e0c06); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #join .box { background: rgba(20,18,8,.92); border: 1px solid #6b5f33; padding: 36px 44px; text-align: center; color: #e8e0c8; }
  #join h1 { color: #ffce54; letter-spacing: 6px; margin-bottom: 6px; font-size: 34px; }
  #join p.sub { color: #8a8060; margin-bottom: 22px; font-size: 13px; letter-spacing: 2px; }
  #join input { display: block; width: 260px; margin: 10px auto; padding: 10px 12px; background: #0e0c06; border: 1px solid #6b5f33; color: #e8e0c8; font-family: inherit; font-size: 15px; }
  #join button { margin-top: 14px; padding: 12px 38px; background: #6b5f33; color: #14120a; border: 0; font-family: inherit; font-weight: bold; font-size: 16px; cursor: pointer; letter-spacing: 2px; }
  #join button:hover { background: #ffce54; }
  #join .hint { margin-top: 16px; font-size: 12px; color: #8a8060; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="crosshair">+</div>
<div class="hud" id="hp">+100</div>
<div class="hud" id="ammo">30 / ∞</div>
<div class="hud" id="timer">3:00</div>
<div class="hud" id="killfeed"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="dmgflash"></div>
<div class="hud" id="healflash"></div>
<div class="hud" id="deathveil"></div>
<div class="hud" id="hitmark">+</div>
<div class="hud" id="scoreboard"></div>
<div id="join">
  <div class="box">
    <h1>DUST ARENA</h1>
    <p class="sub">low-poly fps &middot; cs 1.6 vibes</p>
    <input id="nick" maxlength="16" placeholder="nickname">
    <input id="room" maxlength="24" placeholder="room (default: dust)">
    <button id="go">ENTER →</button>
    <div class="hint">WASD move &middot; SPACE jump &middot; SHIFT walk<br>LMB shoot &middot; R reload &middot; TAB scoreboard<br>1-4 taunts (EZ / NICE SHOT / RUSH B / HELP!)</div>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec8e8);
scene.fog = new THREE.Fog(0xc9b98a, 90, 240);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 400);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.HemisphereLight(0xfff4d6, 0x8a7a50, 0.9));
const sun = new THREE.DirectionalLight(0xffeecc, 1.2);
sun.position.set(40, 60, 20);
scene.add(sun);

// ---------- map (de_dust v2 — generated layout: Tunnels/B west, Mid+Doors center, Long+A site east, catwalk) ----------
const SAND = 0xc9b074;
const worldMeshes = [];
const colliders = []; // {minX..maxZ}
function box(x, z, w, h, d, color, y = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y + h / 2, z);
  scene.add(m); worldMeshes.push(m);
  colliders.push({ minX: x - w/2, maxX: x + w/2, minY: y, maxY: y + h, minZ: z - d/2, maxZ: z + d/2 });
  return m;
}
// floor
{
  const f = new THREE.Mesh(new THREE.BoxGeometry(152, 1, 152), new THREE.MeshLambertMaterial({ color: SAND }));
  f.position.y = -0.5; scene.add(f); worldMeshes.push(f);
}
// [x, z, w, h, d, color, y?]
const MAPDATA = [
  // perimeter
  [0,-74,150,9,2,'#b8995f'], [0,74,150,9,2,'#b8995f'], [-74,0,2,9,150,'#b8995f'], [74,0,2,9,150,'#b8995f'],
  // central blocks: west massif, mid building, double doors (gap 4.5 at z=-8)
  [-36,14,36,6,76,'#b09a5e'], [22,14,8,6,64,'#b8995f'],
  [-10.125,-8,15.75,6,3,'#b8995f'], [10.125,-8,15.75,6,3,'#b8995f'],
  // tunnels (west) + B halls
  [-45.5,58.5,55,5,3,'#a89a78'], [-55.5,13,3,5,78,'#a89a78'], [-63.5,16,3,5,88,'#a89a78'],
  [-67.5,-26.5,11,6,3,'#b8995f'], [-43.5,-26.5,27,6,3,'#b8995f'],
  [-30,-64.75,3,6,16.5,'#b8995f'], [-30,-37.5,3,6,29,'#b8995f'],
  // long A side: east building + long doors (gap at z=-26)
  [64,36,12,6,16,'#b09a5e'], [46.5,-26,11,6,3,'#b8995f'], [64.75,-26,16.5,6,3,'#b8995f'],
  // A site plateau + catwalk
  [51,-48,22,2,16,'#c2a96a'], [27.5,-20,27,2,4,'#c2a96a'], [38,-30,6,2,24,'#c2a96a'],
  // catwalk stairs (mid side)
  [9.8,-20,1.2,0.5,4,'#a89a78'], [11,-20,1.2,1,4,'#a89a78'], [12.2,-20,1.2,1.5,4,'#a89a78'], [13.4,-20,1.2,2,4,'#a89a78'],
  // A stairs (south) + CT stairs (north)
  [51,-35.8,6,0.5,1.2,'#a89a78'], [51,-37,6,1,1.2,'#a89a78'], [51,-38.2,6,1.5,1.2,'#a89a78'], [51,-39.4,6,2,1.2,'#a89a78'],
  [45,-60.2,6,0.5,1.2,'#a89a78'], [45,-59,6,1,1.2,'#a89a78'], [45,-57.8,6,1.5,1.2,'#a89a78'], [45,-56.6,6,2,1.2,'#a89a78'],
  // low cover at spawns
  [4,51,10,1.2,1.5,'#a89a78'], [22,53,6,1.2,1.5,'#a89a78'], [4,-51,10,1.2,1.5,'#a89a78'], [-10,-53,6,1.2,1.5,'#a89a78'],
  // stone blocks
  [30,-69,3,2.5,3,'#a89a78'], [-24,-34,2.5,2.5,2.5,'#a89a78'], [29,30,2.5,2.5,2.5,'#a89a78'],
  [-20,68,3,3,3,'#a89a78'], [22,71,3,3,3,'#a89a78'], [10,-66,2.5,2.5,2.5,'#a89a78'],
  [34,-61,2.8,2.8,2.8,'#a89a78'], [-2,65,3,3,3,'#a89a78'], [20,55.3,2.8,2.8,3.4,'#a89a78'], [26,61.5,3,3,4,'#a89a78'],
  // crates (some stacked)
  [-6,32,2.5,2.5,2.5,'#9b7b48'], [-6,32,2.5,2.5,2.5,'#7e6238',2.5],
  [8,14,3,3,3,'#9b7b48'], [0.9,-31,3,3,3,'#7e6238'], [-1.8,-20,2.5,2.5,2.5,'#9b7b48'],
  [16,53,2.8,2.8,2.8,'#9b7b48'],
  [45,22,2.8,2.8,2.8,'#9b7b48'], [45,22,2.8,2.8,2.8,'#7e6238',2.8],
  [71.2,12,3,3,3,'#9b7b48'], [52,-12,2.5,2.5,2.5,'#9b7b48'],
  [46,-50,2.5,2.5,2.5,'#9b7b48',2], [57,-44,2.5,2.5,2.5,'#7e6238',2],
  [-56,-48,3,3,3,'#9b7b48'], [-56,-48,3,3,3,'#7e6238',3],
  [-42,-60,2.5,2.5,2.5,'#9b7b48'], [-45,-54,2.5,2.5,2.5,'#7e6238'],
  [-58.5,10,2.5,2.5,2.5,'#7e6238'], [-60.5,-8,2.5,2.5,2.5,'#9b7b48'],
];
for (const [x, z, w, h, d, c, y] of MAPDATA) box(x, z, w, h, d, c, y || 0);

// ---------- player physics ----------
const P = { r: 0.4, h: 1.8, eye: 1.6, speed: 7.2, walk: 3.4, jump: 7.5, grav: 21 };
const pos = new THREE.Vector3(0, 0, 30);
const vel = new THREE.Vector3();
let yaw = 0, pitch = 0, onGround = false;
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'Tab') { e.preventDefault(); sb.style.display = 'block'; }
  if (e.code === 'KeyR') reload();
  if (/^Digit[1-4]$/.test(e.code) && document.pointerLockElement) taunt(+e.code[5] - 1);
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Tab') sb.style.display = 'none'; });

function collide() {
  for (const c of colliders) {
    const px = pos.x, pz = pos.z, py = pos.y;
    if (px + P.r <= c.minX || px - P.r >= c.maxX || pz + P.r <= c.minZ || pz - P.r >= c.maxZ) continue;
    if (py >= c.maxY || py + P.h <= c.minY) {
      continue;
    }
    // landing on top
    if (vel.y <= 0 && py >= c.maxY - 0.6) { pos.y = c.maxY; vel.y = 0; onGround = true; continue; }
    // auto step-up (stairs, low ledges)
    if (c.maxY - py <= 0.55 && vel.y <= 0.01) { pos.y = c.maxY; onGround = true; continue; }
    // push out horizontally (smallest overlap)
    const ox1 = (px + P.r) - c.minX, ox2 = c.maxX - (px - P.r);
    const oz1 = (pz + P.r) - c.minZ, oz2 = c.maxZ - (pz - P.r);
    const m = Math.min(ox1, ox2, oz1, oz2);
    if (m === ox1) pos.x = c.minX - P.r; else if (m === ox2) pos.x = c.maxX + P.r;
    else if (m === oz1) pos.z = c.minZ - P.r; else pos.z = c.maxZ + P.r;
  }
  if (pos.y <= 0) { pos.y = 0; vel.y = 0; onGround = true; }
}

// ---------- viewmodel gun ----------
const gun = new THREE.Group();
{
  const mat = new THREE.MeshLambertMaterial({ color: 0x333028 });
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.5), mat); b1.position.z = -0.3;
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.12), mat); b2.position.set(0, -0.08, -0.12);
  gun.add(b1, b2);
  gun.position.set(0.22, -0.18, -0.35);
  camera.add(gun);
}
const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), new THREE.MeshBasicMaterial({ color: 0xffd27a }));
muzzle.position.set(0, 0, -0.62); muzzle.visible = false;
gun.add(muzzle);
scene.add(camera);

// ---------- particles ----------
const parts = [];
const partGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
function burst(p, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color }));
    m.position.copy(p);
    scene.add(m);
    parts.push({
      m, life: 0.7,
      v: new THREE.Vector3((Math.random() - .5) * 6, Math.random() * 5 + 1, (Math.random() - .5) * 6),
    });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    p.v.y -= 14 * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.05) { p.m.position.y = 0.05; p.v.set(0, 0, 0); }
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
}

// ---------- remote players ----------
const remotes = new Map(); // id -> {group, head, buf:[], name, color, hp, dead, kills, deaths}
const labelCanvas = (text) => {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 48;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
  ctx.strokeText(text, 128, 34); ctx.fillText(text, 128, 34);
  return cv;
};
function makeRemote(p) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: p.color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.05, 0.4), mat);
  body.position.y = 0.85;
  const legs = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.35), new THREE.MeshLambertMaterial({ color: 0x4a4438 }));
  legs.position.y = 0.35;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.MeshLambertMaterial({ color: 0xd9b48f }));
  head.position.y = 1.55;
  const rgun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.6), new THREE.MeshLambertMaterial({ color: 0x333028 }));
  rgun.position.set(0.25, 1.2, -0.3);
  const tex = new THREE.CanvasTexture(labelCanvas(p.name));
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  label.scale.set(2.2, 0.42, 1); label.position.y = 2.1;
  g.add(body, legs, head, rgun, label);
  g.position.set(p.x, p.y, p.z);
  body.userData.pid = p.id; legs.userData.pid = p.id; head.userData.pid = p.id; head.userData.head = true;
  scene.add(g);
  remotes.set(p.id, { group: g, head, label, buf: [], name: p.name, color: p.color, hp: p.hp, dead: p.dead, fall: p.dead ? 1 : 0, kills: p.kills || 0, deaths: p.deaths || 0 });
  if (p.dead) { g.rotation.x = Math.PI / 2; r0(g); }
}
function r0(g) { g.position.y = 0.2; }
function removeRemote(id) {
  const r = remotes.get(id);
  if (r) { scene.remove(r.group); remotes.delete(id); }
}
function killRemote(r) {
  r.dead = true; r.fall = 0; r.group.visible = true; r.label.visible = false;
  burst(r.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0x991111);
}
function flinch(r) {
  for (const c of r.group.children) {
    if (c.material && c.material.emissive) {
      c.material.emissive.setHex(0x661111);
    }
  }
  clearTimeout(r.flinchT);
  r.flinchT = setTimeout(() => {
    for (const c of r.group.children) if (c.material && c.material.emissive) c.material.emissive.setHex(0);
  }, 90);
}
const TAUNTS = ['EZ', 'NICE SHOT', 'RUSH B', 'HELP!'];
let tauntCd = 0;
function taunt(n) {
  if (!ws || ws.readyState !== 1 || performance.now() < tauntCd) return;
  tauntCd = performance.now() + 1500;
  ws.send(JSON.stringify({ t: 'chatping', n }));
  showMsg(TAUNTS[n], 1000);
}
function reviveRemote(r) {
  r.dead = false; r.fall = 0; r.buf = [];
  r.group.rotation.x = 0; r.group.position.y = 0;
  r.group.visible = true; r.label.visible = true;
}

// ---------- medkits ----------
const MEDKITS = [[0, -2], [8, -15], [-50, -44], [52, -31], [62, -8], [-59.5, 35]]; // [x, z, y?] — must match server
const medkitMeshes = [];
function buildMedkits(states) {
  MEDKITS.forEach(([x, z, y], i) => {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.9), new THREE.MeshLambertMaterial({ color: 0xf2f2f2 }));
    base.position.y = 0.55;
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.18, 0.2), new THREE.MeshLambertMaterial({ color: 0xd1342f }));
    const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.18, 0.62), new THREE.MeshLambertMaterial({ color: 0xd1342f }));
    c1.position.y = 0.84; c2.position.y = 0.84;
    g.add(base, c1, c2);
    g.position.set(x, y || 0, z);
    g.userData.baseY = y || 0;
    g.visible = states[i] !== 0;
    scene.add(g);
    medkitMeshes.push(g);
  });
}

// ---------- audio ----------
const AC = new (window.AudioContext || window.webkitAudioContext)();
function blip() {
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = 1150;
  const g = AC.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(g).connect(AC.destination); o.start(); o.stop(t + 0.08);
}
function healSound() {
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(500, t); o.frequency.linearRampToValueAtTime(950, t + 0.18);
  const g = AC.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  o.connect(g).connect(AC.destination); o.start(); o.stop(t + 0.3);
}
function shotSound(vol = 0.25, pan = 0) {
  const t = AC.currentTime;
  const buf = AC.createBuffer(1, 2205, 44100);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(g);
  if (pan && AC.createStereoPanner) {
    const p = AC.createStereoPanner(); p.pan.value = pan;
    g.connect(p).connect(AC.destination);
  } else g.connect(AC.destination);
  src.start();
}

// ---------- net ----------
let ws = null, myId = 0, myHp = 100, myKills = 0, myDeaths = 0, dead = false;
let roundEndsAt = Date.now() + 180000, frozen = false, serverOffset = 0;
const $ = id => document.getElementById(id);
const sb = $('scoreboard');

const params = new URLSearchParams(location.search);
const SPECTATE = !!params.get('spectate'); // ?spectate=1 — overhead map view, no join
if (SPECTATE) {
  $('join').style.display = 'none';
  scene.fog = null;
  gun.visible = false;
  camera.position.set(0, 135, 0.1);
  camera.lookAt(0, 0, 0);
}
if (params.get('room')) $('room').value = params.get('room');
$('nick').value = localStorage.getItem('nick') || '';
$('go').onclick = join;
$('nick').addEventListener('keydown', e => e.key === 'Enter' && join());
$('room').addEventListener('keydown', e => e.key === 'Enter' && join());

function join() {
  if (ws) return; // Space on a focused button must not re-join
  $('go').blur();
  const nick = $('nick').value.trim() || 'player' + Math.floor(Math.random() * 99);
  const room = ($('room').value.trim() || 'dust').replace(/[^\w-]/g, '') || 'dust';
  localStorage.setItem('nick', nick);
  history.replaceState(null, '', '?room=' + room);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name: nick, room }));
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  ws.onclose = () => showMsg('DISCONNECTED — refresh to rejoin', 999999);
  $('join').style.display = 'none';
  document.body.requestPointerLock && renderer.domElement.requestPointerLock();
  AC.resume();
}

function onMsg(m) {
  switch (m.t) {
    case 'init':
      myId = m.id;
      pos.set(m.spawn[0], m.spawn[1], m.spawn[2]);
      yaw = Math.atan2(pos.x, pos.z); pitch = 0; // face map center
      roundEndsAt = m.roundEndsAt; serverOffset = m.now - Date.now();
      for (const p of m.players) if (p.id !== myId) makeRemote(p);
      buildMedkits(m.medkits || []);
      break;
    case 'medkit':
      if (medkitMeshes[m.i]) medkitMeshes[m.i].visible = false;
      if (m.id === myId) { myHp = m.hp; healFlash(); healSound(); }
      break;
    case 'medkitup':
      if (medkitMeshes[m.i]) medkitMeshes[m.i].visible = true;
      break;
    case 'joined': makeRemote(m.player); feed(`${m.player.name} joined`); break;
    case 'left': { const r = remotes.get(m.id); if (r) feed(`${r.name} left`); removeRemote(m.id); break; }
    case 'states':
      for (const p of m.players) {
        if (p.id === myId) { myHp = p.hp; myKills = p.kills; myDeaths = p.deaths; continue; }
        const r = remotes.get(p.id);
        if (!r) continue;
        r.hp = p.hp; r.kills = p.kills; r.deaths = p.deaths;
        if (p.dead !== r.dead) { p.dead ? killRemote(r) : reviveRemote(r); } // missed-event sync
        if (p.dead) continue;
        r.buf.push({ time: m.now, x: p.x, y: p.y, z: p.z, ry: p.ry });
        if (r.buf.length > 20) r.buf.shift();
      }
      break;
    case 'shoot': {
      const r = remotes.get(m.id);
      if (r && m.o && m.d) {
        const o = new THREE.Vector3(...m.o);
        tracer(o, new THREE.Vector3(...m.d));
        // spatialized: volume by distance, stereo pan by bearing
        const dist = camera.position.distanceTo(o);
        const toS = o.clone().sub(camera.position).applyQuaternion(camera.quaternion.clone().invert());
        const pan = THREE.MathUtils.clamp(toS.x / (toS.length() || 1), -1, 1);
        shotSound(Math.min(0.3, 4 / (dist + 2)), pan);
      }
      break;
    }
    case 'chatping': {
      const r = remotes.get(m.id);
      if (r) {
        const tex = new THREE.CanvasTexture(labelCanvas(TAUNTS[m.n] || '...'));
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
        s.scale.set(2.4, 0.45, 1); s.position.y = 2.6;
        r.group.add(s);
        setTimeout(() => r.group.remove(s), 2000);
        blip();
        feed(`${r.name}: ${TAUNTS[m.n] || '...'}`);
      }
      break;
    }
    case 'hp':
      if (m.id === myId) { myHp = m.hp; flash(); slowUntil = performance.now() + 450; }
      else { const r = remotes.get(m.id); if (r) { r.hp = m.hp; flinch(r); } }
      if (m.by === myId) hitmark();
      break;
    case 'die': {
      const killer = m.by === myId ? 'you' : (remotes.get(m.by)?.name || '?');
      const victim = m.id === myId ? 'you' : (remotes.get(m.id)?.name || '?');
      feed(`${killer} ${m.head ? '⌖' : '☠'} ${victim}`);
      if (m.id === myId) { dead = true; myHp = 0; showMsg('YOU DIED — respawning…', 3000); flash(); $('deathveil').style.opacity = 1; }
      else { const r = remotes.get(m.id); if (r) killRemote(r); }
      if (m.by === myId) {
        hitmark();
        const banners = { 3: 'ON FIRE!', 5: 'RAMPAGE!', 7: 'GODLIKE!', 10: 'UNSTOPPABLE!' };
        showMsg(m.head ? 'HEADSHOT!' : (banners[m.streak] || 'KILL'), 1100);
      }
      break;
    }
    case 'respawn':
      if (m.id === myId) { dead = false; myHp = 100; pos.set(...m.spawn); vel.set(0, 0, 0); yaw = Math.atan2(pos.x, pos.z); $('deathveil').style.opacity = 0; }
      else { const r = remotes.get(m.id); if (r) { reviveRemote(r); r.group.position.set(...m.spawn); } }
      break;
    case 'roundend': {
      frozen = true;
      const top = m.scores[0];
      showMsg(`ROUND OVER${top ? ' — ' + top.name + ' wins (' + top.kills + ' kills)' : ''}`, m.breakMs);
      sb.style.display = 'block'; renderScores();
      break;
    }
    case 'roundstart':
      frozen = false; dead = false; myHp = 100; myKills = 0; myDeaths = 0;
      $('deathveil').style.opacity = 0;
      for (const mk of medkitMeshes) mk.visible = true;
      for (const r of remotes.values()) reviveRemote(r);
      pos.set(...m.spawn); vel.set(0, 0, 0); yaw = Math.atan2(pos.x, pos.z);
      roundEndsAt = m.roundEndsAt; serverOffset = m.now - Date.now();
      sb.style.display = 'none'; showMsg('ROUND START', 1500);
      break;
  }
}

// ---------- HUD helpers ----------
let msgTimer = null;
function showMsg(text, ms) {
  $('msg').textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => $('msg').textContent = '', ms);
}
function feed(text) {
  const kf = $('killfeed');
  const d = document.createElement('div'); d.textContent = text;
  kf.prepend(d);
  while (kf.children.length > 6) kf.lastChild.remove();
  setTimeout(() => d.remove(), 6000);
}
function flash() {
  const f = $('dmgflash');
  f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 120);
}
function healFlash() {
  const f = $('healflash');
  f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 280);
}
let hmT = null;
function hitmark() {
  const h = $('hitmark');
  h.style.opacity = 1; blip();
  clearTimeout(hmT); hmT = setTimeout(() => h.style.opacity = 0, 90);
}
function renderScores() {
  const rows = [{ name: 'you', kills: myKills, deaths: myDeaths, me: true },
    ...[...remotes.values()].map(r => ({ name: r.name, kills: r.kills, deaths: r.deaths }))]
    .sort((a, b) => b.kills - a.kills);
  sb.innerHTML = '<table><tr><th>player</th><th>K</th><th>D</th></tr>' +
    rows.map(r => `<tr style="${r.me ? 'color:#7CFC00' : ''}"><td>${r.name}</td><td>${r.kills}</td><td>${r.deaths}</td></tr>`).join('') + '</table>';
}

// ---------- pointer lock & shooting ----------
renderer.domElement.addEventListener('click', () => {
  if (ws && document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
let firing = false, lastShot = 0, ammo = 30, reloading = false, spread = 0, stepT = 0;
let shotIndex = 0, hSpeed = 0, slowUntil = 0, lastBeepSec = -1;
function baseSpread() {
  if (!onGround) return 0.045;
  return hSpeed > 4.5 ? 0.018 : 0.002;
}
addEventListener('mousedown', e => { if (e.button === 0) firing = true; });
addEventListener('mouseup', e => { if (e.button === 0) firing = false; });
function reload() {
  if (reloading || ammo === 30 || dead) return;
  reloading = true;
  $('ammo').textContent = 'RELOADING';
  shotSound(0.05); setTimeout(() => shotSound(0.06), 1300); // mag out / mag in clicks
  setTimeout(() => { ammo = 30; reloading = false; }, 2000);
}
const raycaster = new THREE.Raycaster();
function tracer(origin, dir) {
  const geo = new THREE.BufferGeometry().setFromPoints([origin, origin.clone().addScaledVector(dir, 120)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffe9a0, transparent: true, opacity: 0.7 }));
  scene.add(line);
  setTimeout(() => { scene.remove(line); geo.dispose(); }, 60);
}
function shoot(now) {
  if (dead || frozen || reloading || ammo <= 0 || document.pointerLockElement !== renderer.domElement) return;
  if (now - lastShot < 110) return;
  if (now - lastShot > 250) shotIndex = 0;
  lastShot = now; ammo--;
  if (ammo === 0) reload();
  spread = Math.min(Math.max(spread, baseSpread()) + 0.006, 0.045);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  dir.x += (Math.random() - 0.5) * spread;
  dir.y += (Math.random() - 0.5) * spread;
  dir.normalize();
  const origin = camera.position.clone();
  raycaster.set(origin, dir);
  raycaster.far = 250;
  const targets = [];
  for (const [id, r] of remotes) if (!r.dead) targets.push(...r.group.children.filter(c => c.userData.pid));
  const hitsP = raycaster.intersectObjects(targets, false);
  const hitsW = raycaster.intersectObjects(worldMeshes, false);
  const pHit = hitsP[0], wHit = hitsW[0];
  if (pHit && (!wHit || pHit.distance < wHit.distance)) {
    ws.send(JSON.stringify({ t: 'hit', target: pHit.object.userData.pid, head: !!pHit.object.userData.head }));
  } else if (wHit) {
    // dust puff where the bullet lands
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color: 0xd9c79a }));
    m.position.copy(wHit.point); m.scale.setScalar(1.8);
    scene.add(m);
    parts.push({ m, life: 0.18, v: new THREE.Vector3(0, 0.6, 0) });
  }
  ws.send(JSON.stringify({ t: 'shoot', o: origin.toArray(), d: dir.toArray() }));
  tracer(origin.clone().add(dir.clone().multiplyScalar(1.5)).add(new THREE.Vector3(0, -0.15, 0)), dir);
  shotSound();
  gun.position.z = -0.28; // recoil kick
  muzzle.visible = true;
  clearTimeout(muzzle.userData.t);
  muzzle.userData.t = setTimeout(() => muzzle.visible = false, 45);
  // AK-style learnable recoil: vertical climb breaking into horizontal wobble
  shotIndex++;
  pitch += shotIndex <= 4 ? 0.012 : 0.005;
  if (shotIndex > 4) yaw += Math.sin(shotIndex * 0.9) * 0.006;
}

// ---------- main loop ----------
let lastT = performance.now(), lastSend = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  if (ws && !dead && !frozen) {
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(fwd);
    if (keys['KeyS']) move.sub(fwd);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    if (move.lengthSq() > 0) move.normalize();
    // tagging: getting hit slows you for 450ms
    const sp = (keys['ShiftLeft'] ? P.walk : P.speed) * (now < slowUntil ? 0.55 : 1);
    hSpeed = move.lengthSq() > 0 ? sp : 0;
    pos.x += move.x * sp * dt;
    pos.z += move.z * sp * dt;
    if (keys['Space'] && onGround) { vel.y = P.jump; onGround = false; }
    vel.y -= P.grav * dt;
    pos.y += vel.y * dt;
    onGround = false;
    collide();
    pos.x = Math.max(-72.5, Math.min(72.5, pos.x));
    pos.z = Math.max(-72.5, Math.min(72.5, pos.z));
    if (firing) shoot(now); else spread = Math.max(baseSpread(), spread - 0.12 * dt);
    gun.position.z += (-0.35 - gun.position.z) * 0.2;
    const moving = move.lengthSq() > 0 && onGround;
    if (moving) { stepT += dt; if (stepT > 0.37) { stepT = 0; shotSound(0.018); } } else stepT = 0;
    gun.position.y = -0.18 + (moving ? Math.sin(now * 0.013) * 0.012 : 0);
  }
  gun.rotation.x += ((reloading ? -0.95 : 0) - gun.rotation.x) * 0.18;
  updateParts(dt);
  for (const mk of medkitMeshes) {
    if (!mk.visible) continue;
    mk.rotation.y += dt * 1.6;
    mk.position.y = mk.userData.baseY + 0.12 + Math.sin(now * 0.0035) * 0.1;
  }

  if (!SPECTATE) {
    camera.position.set(pos.x, pos.y + (dead ? 0.5 : P.eye), pos.z);
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  }

  // interpolate remotes (render 120ms in the past)
  const renderTime = Date.now() + serverOffset - 120;
  for (const r of remotes.values()) {
    if (r.dead) { // fall over and lie until respawn
      if (r.fall < 1) {
        r.fall = Math.min(1, r.fall + dt * 2.4);
        const e = 1 - Math.pow(1 - r.fall, 3);
        r.group.rotation.x = e * Math.PI / 2 * 0.97;
        r.group.position.y = e * 0.2;
      }
      continue;
    }
    const b = r.buf;
    while (b.length > 2 && b[1].time <= renderTime) b.shift();
    if (b.length >= 2) {
      const [a, c] = b;
      const t = Math.max(0, Math.min(1, (renderTime - a.time) / Math.max(1, c.time - a.time)));
      r.group.position.set(a.x + (c.x - a.x) * t, a.y + (c.y - a.y) * t, a.z + (c.z - a.z) * t);
      r.group.rotation.y = a.ry + (c.ry - a.ry) * t;
    } else if (b.length === 1) {
      r.group.position.set(b[0].x, b[0].y, b[0].z);
      r.group.rotation.y = b[0].ry;
    }
  }

  // net send 20Hz
  if (ws && ws.readyState === 1 && now - lastSend > 50) {
    lastSend = now;
    ws.send(JSON.stringify({ t: 'state', x: +pos.x.toFixed(2), y: +pos.y.toFixed(2), z: +pos.z.toFixed(2), ry: +yaw.toFixed(3), rx: +pitch.toFixed(3) }));
  }

  // HUD
  $('hp').textContent = '+' + Math.max(0, myHp);
  $('hp').style.color = myHp > 50 ? '#7CFC00' : myHp > 25 ? '#ffce54' : '#ff5544';
  if (!reloading) $('ammo').textContent = ammo + ' / ∞';
  $('crosshair').style.fontSize = Math.round(16 + spread * 700) + 'px'; // dynamic: shows your accuracy
  const left = Math.max(0, roundEndsAt - (Date.now() + serverOffset));
  $('timer').textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left % 60000 / 1000)).padStart(2, '0')}  |  K ${myKills} / D ${myDeaths}`;
  $('timer').style.color = left <= 30000 && !frozen ? '#ff5544' : '#e8e0c8';
  if (ws && !frozen && left > 0 && left <= 10000) {
    const s = Math.floor(left / 1000);
    if (s !== lastBeepSec) { lastBeepSec = s; blip(); }
  }
  if (sb.style.display === 'block') renderScores();

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
